name: Test Build

on: [push]

jobs:
  build:
    name: Hugo ${{ matrix.hugo-version }}
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        hugo-version: ["0.86.1", "latest"]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}

      - name: Test example site
        run: ./scripts/test-example.sh

      - name: Check current Hugo warnings
        if: matrix.hugo-version == 'latest'
        working-directory: ./exampleSite
        run: hugo --themesDir ../.. --renderToMemory --panicOnWarning
