{{ define "main" }}
  <article class="mt-10 flex flex-col items-center justify-center">
    <nav class="place-self-start">
      <a href="{{ "" | relURL }}" class="theme-muted">&larr; {{ i18n "nav.home" }}</a>
    </nav>
    <header>
      <h1 class="theme-heading mb-6 mt-2 text-center text-4xl font-extrabold">
        {{ .Title | emojify }}
      </h1>
    </header>
    <section class="theme-prose prose">
      {{ .Content | emojify }}
    </section>
  </article>
{{ end }}
